name: Notify Subscribers

on:
  push:
    branches:
      - main
    paths:
      - 'content/posts/*.mdx'
  workflow_dispatch:
    inputs:
      slug:
        description: Post slug to notify subscribers about
        required: true
        type: string

concurrency:
  group: notify-subscribers
  cancel-in-progress: false

jobs:
  notify:
    name: Generate and send email
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine post slug
        id: post
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SLUG: ${{ inputs.slug }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "slug=$MANUAL_SLUG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_posts < <(
            git diff --name-only --diff-filter=A "$BEFORE_SHA" "$CURRENT_SHA" -- 'content/posts/*.mdx'
          )

          if [[ "${#changed_posts[@]}" -ne 1 ]]; then
            echo "Expected exactly one newly added post, found ${#changed_posts[@]}."
            printf '%s\n' "${changed_posts[@]}"
            echo "Use workflow_dispatch to send a specific post manually."
            exit 1
          fi

          filename="${changed_posts[0]##*/}"
          echo "slug=${filename%.mdx}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate email payload
        run: |
          npm run generate-email-html -- \
            --slug "${{ steps.post.outputs.slug }}" \
            --subject "New post alert" \
            --author "George"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_NOTIFY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Invoke notification Lambda
        run: |
          aws lambda invoke \
            --function-name george-blog-subscribe-prod-notifySubscribers \
            --invocation-type RequestResponse \
            --payload fileb://scripts/generate-email/email-test.json \
            response.json

          cat response.json

          if jq -e '.FunctionError' response.json > /dev/null; then
            echo "The notification Lambda returned an error."
            exit 1
          fi