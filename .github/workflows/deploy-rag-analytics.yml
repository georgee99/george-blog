name: Deploy RAG Analytics Lambda

on:
  push:
    branches:
      - master
    paths:
      - 'lambda/rag-analytics/**'
      - '.github/workflows/deploy-rag-analytics.yml'
  workflow_dispatch:

concurrency:
  group: deploy-rag-analytics
  cancel-in-progress: false

jobs:
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: lambda/rag-analytics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lambda/rag-analytics/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

  deploy:
    name: Deploy
    needs: type-check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: lambda/rag-analytics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lambda/rag-analytics/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        run: npx serverless deploy
        env:
          RAG_ANALYTICS_API_KEY: ${{ secrets.RAG_ANALYTICS_API_KEY }}
